name: Android app

# Builds the Android test app on each push to main and publishes it as a download:
# https://github.com/gaetandg/Coriace/releases/download/android-test/coriace.apk
# With the upload key in the repository secrets, also builds the Play Store bundle (.aab),
# kept as an artifact of the run. With the Google Play service account too, sends the bundle
# to the internal test track; run by hand with "production" to release it to everyone.
on:
  push:
    branches: [main]
    # Notes and docs don't change the app: no new version for them.
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      track:
        description: Piste Google Play
        type: choice
        options: [internal, production]
        default: internal

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:android
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Build the test app
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish the test app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk coriace.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease \
            --title "Coriace pour Android (version de test)" \
            --notes "Version de test de l'app Android, refaite à chaque modification. Télécharge coriace.apk depuis ton téléphone et installe-le."
          gh release upload android-test coriace.apk --clobber
      - name: Build the Play Store bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "No upload key in the secrets: no Play Store bundle."; exit 0; fi
          export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$UPLOAD_KEYSTORE"
          ./gradlew bundleRelease --no-daemon
          rm "$UPLOAD_KEYSTORE"
      - name: Keep the Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: coriace-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
      - name: Send the bundle to Google Play
        if: env.PLAY_UPLOAD == 'true' && hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.coriace
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: android/whatsnew
